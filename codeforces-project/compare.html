<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compare Codeforces Profiles</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">Compare Codeforces Profiles</h1>
    <form id="compareForm" class="space-y-4 mb-6">
      <div>
        <label for="handle1" class="block text-lg font-semibold">Handle 1</label>
        <input type="text" id="handle1" class="mt-1 w-full p-2 bg-gray-800 border border-gray-600 rounded" />
        <p id="error1" class="text-red-500 text-sm"></p>
      </div>
      <div>
        <label for="handle2" class="block text-lg font-semibold">Handle 2</label>
        <input type="text" id="handle2" class="mt-1 w-full p-2 bg-gray-800 border border-gray-600 rounded" />
        <p id="error2" class="text-red-500 text-sm"></p>
      </div>
      <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-semibold">Compare</button>
    </form>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    <div id="commonContestsSection" class="mt-8 hidden">
      <h2 class="text-2xl font-bold mb-4">Common Contests</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full table-auto bg-gray-800 rounded-lg overflow-hidden">
          <thead>
            <tr class="bg-gray-700 text-white">
              <th class="px-4 py-2">Contest</th>
              <th id="handle1Header" class="px-4 py-2"></th>
              <th id="handle2Header" class="px-4 py-2"></th>
            </tr>
          </thead>
          <tbody id="commonContestsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("compareForm");
    const results = document.getElementById("results");
    const error1 = document.getElementById("error1");
    const error2 = document.getElementById("error2");
    const commonSection = document.getElementById("commonContestsSection");
    const commonTable = document.getElementById("commonContestsTable");

    let chart1 = null;
    let chart2 = null;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const handle1 = document.getElementById("handle1").value.trim();
      const handle2 = document.getElementById("handle2").value.trim();
      error1.textContent = "";
      error2.textContent = "";
      results.innerHTML = "";
      commonTable.innerHTML = "";
      commonSection.classList.add("hidden");

      const user1 = await fetchUserInfo(handle1, error1);
      const user2 = await fetchUserInfo(handle2, error2);

      if (!user1 || !user2) return;

      const history1 = await fetchRating(handle1);
      const history2 = await fetchRating(handle2);

      renderUserCard(user1, history1, 1);
      renderUserCard(user2, history2, 2);

      const common = findCommonContests(history1, history2);
      if (common.length) {
        document.getElementById("handle1Header").textContent = handle1 + " Rank";
        document.getElementById("handle2Header").textContent = handle2 + " Rank";
        common.forEach(contest => {
          const row = `<tr class="bg-gray-900 text-white">
            <td class="border px-4 py-2">${contest.contestName}</td>
            <td class="border px-4 py-2">${contest.rank1}</td>
            <td class="border px-4 py-2">${contest.rank2}</td>
          </tr>`;
          commonTable.innerHTML += row;
        });
        commonSection.classList.remove("hidden");
      }
    });

    async function fetchUserInfo(handle, errorElem) {
      try {
        const res = await fetch(`https://codeforces.com/api/user.info?handles=${handle}`);
        const data = await res.json();
        if (data.status === "OK") return data.result[0];
        errorElem.textContent = "User not found";
      } catch (err) {
        errorElem.textContent = "Network error";
      }
      return null;
    }

    async function fetchRating(handle) {
      const res = await fetch(`https://codeforces.com/api/user.rating?handle=${handle}`);
      const data = await res.json();
      return data.status === "OK" ? data.result : [];
    }

    function findCommonContests(a, b) {
      const bMap = new Map(b.map(c => [c.contestId, c]));
      return a.filter(c => bMap.has(c.contestId)).map(c => ({
        contestId: c.contestId,
        contestName: c.contestName,
        rank1: c.rank,
        rank2: bMap.get(c.contestId).rank
      }));
    }

    function getHandleColor(rating) {
      if (rating >= 3000) return "#FF0000";
      if (rating >= 2600) return "#FF0000";
      if (rating >= 2400) return "#FF8C00";
      if (rating >= 2300) return "#FF8C00";
      if (rating >= 2100) return "#AA00AA";
      if (rating >= 1900) return "#0000FF";
      if (rating >= 1600) return "#03A89E";
      if (rating >= 1400) return "#008000";
      return "#808080";
    }

    function renderUserCard(user, ratings, userNum) {
      const container = document.createElement("div");
      container.className = "bg-gray-700 rounded-lg p-4";

      const color = getHandleColor(user.rating);
      container.innerHTML = `
        <div class="flex justify-center mb-4">
          <img src="${user.titlePhoto}" class="w-32 h-32 rounded-full border-4 border-white bg-white" />
        </div>
        <h2 class="text-xl font-semibold text-center" style="color: ${color};">${user.handle}</h2>
        <p class="text-center">Rank: <span style="color: ${color};">${user.rank}</span></p>
        <p class="text-center">Rating: <span style="color: ${color};">${user.rating}</span></p>
        <p class="text-center">Max Rating: <span style="color: ${color};">${user.maxRating}</span></p>
        <div class="mt-4">
          <h3 class="text-lg font-bold mb-2">Rating History</h3>
          <canvas id="chart${userNum}" class="w-full h-[300px]"></canvas>
        </div>
      `;
      results.appendChild(container);
      plotChart(ratings, userNum);
    }

    function plotChart(data, num) {
      const ctx = document.getElementById(`chart${num}`);
      const labels = data.map(d => new Date(d.ratingUpdateTimeSeconds * 1000).toLocaleDateString());
      const ratings = data.map(d => d.newRating);
      const color = num === 1 ? "rgba(34, 197, 94, 1)" : "rgba(54, 162, 235, 1)";

      if (num === 1 && chart1) chart1.destroy();
      if (num === 2 && chart2) chart2.destroy();

      const chart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: `Rating (User ${num})`,
            data: ratings,
            borderColor: color,
            backgroundColor: color.replace("1)", "0.2)"),
            borderWidth: 2,
            pointRadius: 4,
          }],
        },
        options: {
          responsive: true,
          scales: {
            x: { ticks: { font: { weight: "bold" } } },
            y: { beginAtZero: false, ticks: { font: { weight: "bold" } } },
          },
          plugins: {
            legend: {
              labels: { font: { weight: "bold" } }
            }
          }
        }
      });

      if (num === 1) chart1 = chart;
      else chart2 = chart;
    }
  </script>
</body>
</html>
