<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Contest - Coderia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

<!-- NAVIGATION HEADER (reused) -->
<header class="bg-gray-800 p-4 shadow-lg w-full">
  <nav class="flex items-center">
    <div>
      <a href="./index.html" class="text-2xl font-bold pl-4">Coderia</a>
    </div>
    <div class="flex ml-auto items-center space-x-6 pr-4">
      <a href="./index.html" class="text-lg font-semibold hover:underline">HOME</a>
      <a href="./profile.html" class="text-lg font-semibold hover:underline">PROFILE</a>
      <a href="./submissions.html" class="text-lg font-semibold hover:underline">SUBMISSIONS</a>
      <a href="./contest_list.html" class="text-lg font-semibold hover:underline">CONTESTS</a>
      <a href="./problemset.html" class="text-lg font-semibold hover:underline">PROBLEMSET</a>
      <a href="./compare.html" class="text-lg font-semibold hover:underline">COMPARE</a>
    </div>
  </nav>
</header>

<!-- CREATE CONTEST SECTION -->
<div class="max-w-3xl mx-auto mt-12 bg-gray-800 p-6 rounded-lg shadow-lg">
  <h2 class="text-2xl font-bold mb-4">Create a New Contest</h2>

  <div class="mb-4">
    <label class="block mb-1 text-gray-300">Contest Name</label>
    <input id="contest-name" type="text" class="w-full p-2 bg-gray-700 rounded border border-gray-600" placeholder="Enter contest name" />
  </div>

  <div class="mb-4">
    <label class="block mb-1 text-gray-300">Problem Codes (Comma separated, e.g. 1234A, 1234B)</label>
    <input id="problem-codes" type="text" class="w-full p-2 bg-gray-700 rounded border border-gray-600" placeholder="Enter problems" />
  </div>

  <div class="mb-4">
    <label class="block mb-1 text-gray-300">Duration (in minutes)</label>
    <input id="duration" type="number" class="w-full p-2 bg-gray-700 rounded border border-gray-600" placeholder="60" />
  </div>

  <button onclick="createContest()" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded mt-2">Create Contest</button>
</div>

<script>
  function createContest() {
    const name = document.getElementById("contest-name").value.trim();
    const problems = document.getElementById("problem-codes").value.trim().split(",");
    const duration = parseInt(document.getElementById("duration").value.trim()) * 60 * 1000; // minutes to ms

    if (!name || problems.length === 0 || isNaN(duration)) {
      alert("Please fill all the fields properly.");
      return;
    }

    const contestId = Date.now(); // unique
    const contest = {
      contestId,
      name,
      problems: problems.map(p => p.trim()),
      startTime: Date.now(),
      duration,
      participants: [], // usernames
      leaderboard: {} // { username: score }
    };

    let contests = JSON.parse(localStorage.getItem("contests")) || [];
    contests.push(contest);
    localStorage.setItem("contests", JSON.stringify(contests));

    alert("Contest created successfully!");
    window.location.href = `contestRoom.html?id=${contestId}`;
  }
</script>
</body>
</html>
