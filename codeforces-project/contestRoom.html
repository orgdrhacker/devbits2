<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contest Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <!-- Header -->
  <header class="bg-gray-800 p-4 w-full shadow-lg">
    <nav class="flex items-center justify-between">
      <a href="./index.html" class="text-2xl font-bold pl-4">Coderia</a>
      <div class="flex space-x-6 pr-4">
        <a href="./index.html" class="hover:underline">HOME</a>
        <a href="./profile.html" class="hover:underline">PROFILE</a>
        <a href="./submissions.html" class="hover:underline">SUBMISSIONS</a>
        <a href="./contest_list.html" class="hover:underline">CONTESTS</a>
        <a href="./problemset.html" class="hover:underline">PROBLEMSET</a>
        <a href="./compare.html" class="hover:underline">COMPARE</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto mt-12 bg-gray-800 p-6 rounded-lg shadow-lg">
    <h1 id="contest-title" class="text-2xl font-bold mb-4">Loading...</h1>
    <p><strong>Countdown:</strong> <span id="countdown">Loading...</span></p>

    <!-- Problems -->
    <h2 class="mt-6 text-xl font-semibold">Problems</h2>
    <div id="problem-list" class="bg-gray-700 p-4 mt-2 rounded-lg">
      Loading problems...
    </div>

    <!-- Join / Leave -->
    <div class="mt-6">
      <button id="join-btn" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded hidden">
        Join Contest
      </button>
      <button id="leave-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded hidden">
        Leave Contest
      </button>
    </div>

    <!-- Leaderboard -->
    <h2 class="mt-8 text-xl font-semibold">Leaderboard</h2>
    <div class="overflow-x-auto mt-2">
      <table id="leaderboard" class="min-w-full text-left bg-gray-700 rounded-lg">
        <thead>
          <tr class="border-b border-gray-600">
            <th class="px-4 py-2">Rank</th>
            <th class="px-4 py-2">Handle</th>
            <th class="px-4 py-2">Solved</th>
            <th class="px-4 py-2">Last Solve</th>
          </tr>
        </thead>
        <tbody>
          <!-- filled by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cid = urlParams.get("id");
      const contests = JSON.parse(localStorage.getItem("contests")) || [];
      const contest = contests.find(c => c.contestId == cid);
      if (!contest) return alert("Contest not found.");

      // Header texts
      document.getElementById("contest-title").textContent = contest.name;
      // Countdown
      const countEl = document.getElementById("countdown");
      const tick = () => {
        const rem = (contest.startTime + contest.duration) - Date.now();
        if (rem <= 0) countEl.textContent = "Contest ended";
        else {
          const h = Math.floor(rem / 1000 / 60 / 60);
          const m = Math.floor((rem / 1000 / 60) % 60);
          countEl.textContent = `${h}h ${m}m remaining`;
        }
      };
      tick();
      setInterval(tick, 60_000);

      // Load Problems
      try {
        const r = await fetch("https://codeforces.com/api/problemset.problems");
        const { result: { problems } } = await r.json();
        const list = document.getElementById("problem-list");
        list.innerHTML = "";
        contest.problems.forEach(code => {
          const m = code.match(/^(\d+)([A-Z])$/);
          if (!m) return;
          const [_, pid, idx] = m;
          const p = problems.find(x => x.contestId == pid && x.index == idx);
          if (p) {
            const card = document.createElement("div");
            card.className = "bg-gray-600 p-3 rounded mb-2";
            card.innerHTML = `
              <a href="https://codeforces.com/contest/${pid}/problem/${idx}"
                 target="_blank"
                 class="text-blue-300 font-semibold hover:underline">
                ${p.name} (${p.index})
              </a>
              <span class="text-sm text-gray-300 ml-2">[rating ${p.rating||'–'}]</span>
            `;
            list.appendChild(card);
          }
        });
      } catch(e) {
        console.error(e);
        document.getElementById("problem-list").textContent = "Failed to load problems.";
      }

      // Join/Leave Logic
      const user = localStorage.getItem("cf_username");
      const joinBtn = document.getElementById("join-btn");
      const leaveBtn = document.getElementById("leave-btn");
      const saveContest = () => localStorage.setItem("contests", JSON.stringify(contests));
      const refreshButtons = () => {
        if (!user) {
          joinBtn.textContent = "Log in to join";
          joinBtn.classList.remove("hidden");
          leaveBtn.classList.add("hidden");
        } else if (contest.participants?.includes(user)) {
          leaveBtn.classList.remove("hidden");
          joinBtn.classList.add("hidden");
        } else {
          joinBtn.textContent = "Join Contest";
          joinBtn.classList.remove("hidden");
          leaveBtn.classList.add("hidden");
        }
      };
      refreshButtons();

      // Leaderboard
      const lbBody = document.querySelector("#leaderboard tbody");
      async function updateLeaderboard() {
        if (!contest.participants?.length) {
          lbBody.innerHTML = `<tr><td colspan="4" class="px-4 py-2">No participants yet.</td></tr>`;
          return;
        }
        const results = [];
        for (const handle of contest.participants) {
          let solvedSet = new Set();
          let lastTs = 0;
          try {
            const res = await fetch(
              `https://codeforces.com/api/user.status?handle=${handle}&from=1&count=5000`
            );
            const { result, status } = await res.json();
            if (status !== "OK") throw null;
            result.forEach(s => {
              const code = `${s.problem.contestId}${s.problem.index}`;
              if (s.verdict === "OK" && contest.problems.includes(code)) {
                solvedSet.add(code);
                if (s.creationTimeSeconds > lastTs) {
                  lastTs = s.creationTimeSeconds;
                }
              }
            });
          } catch {
            // on error, keep solvedSet empty and lastTs=0
          }
          results.push({
            handle,
            score: solvedSet.size,
            lastSolve: lastTs
          });
        }
        // sort by score desc, then lastSolve asc (earlier solves rank higher on tie)
        results.sort((a,b) => {
          if (b.score !== a.score) return b.score - a.score;
          return (a.lastSolve || Infinity) - (b.lastSolve || Infinity);
        });

        lbBody.innerHTML = "";
        results.forEach((r, i) => {
          const tr = document.createElement("tr");
          tr.className = i % 2 ? "bg-gray-800" : "bg-gray-700";
          const timeText = r.lastSolve
            ? new Date(r.lastSolve * 1000).toLocaleString()
            : "—";
          tr.innerHTML = `
            <td class="px-4 py-2">${i + 1}</td>
            <td class="px-4 py-2">${r.handle}</td>
            <td class="px-4 py-2">${r.score}</td>
            <td class="px-4 py-2">${timeText}</td>
          `;
          lbBody.appendChild(tr);
        });
      }

      // Join/Leave handlers + immediate refresh
      joinBtn.onclick = () => {
        if (!user) return window.location.href = "./login.html";
        contest.participants = contest.participants || [];
        if (!contest.participants.includes(user)) contest.participants.push(user);
        saveContest();
        refreshButtons();
        updateLeaderboard();
      };
      leaveBtn.onclick = () => {
        contest.participants = (contest.participants || []).filter(u => u !== user);
        saveContest();
        refreshButtons();
        updateLeaderboard();
      };

      // initial + polling
      updateLeaderboard();
      setInterval(updateLeaderboard, 60_000);
    });
  </script>
</body>
</html>
